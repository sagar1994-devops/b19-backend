apiVersion: apps/v1
kind: Deployment
metadata:
  name: b19-backend-app
  labels:
    app: b19-backend-app
spec:
  selector:
    matchLabels:
      app: b19-backend-app
  replicas: 2
  template:
    metadata:
      labels:
        app: b19-backend-app
    spec:
      containers:
        - name: b19-backend-app
          image: 869935100382.dkr.ecr.us-east-2.amazonaws.com/backend:latest
          ports:
            - containerPort: 8080
